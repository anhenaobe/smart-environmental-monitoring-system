[platformio]
default_envs = nucleo_l432kc, nucleo_l412kb

[env]
platform = ststm32@19.5.0
framework = stm32cube
board_build.f_cpu = 16000000L
upload_protocol = stlink
debug_tool = stlink
build_flags = -Wall -Wextra -Werror
platform_packages =
    framework-stm32cubel4@1.18.1
    toolchain-gccarmnoneeabi@1.70201.0
    tool-ldscripts-ststm32@0.2.0

[env:nucleo_l432kc]
board = nucleo_l432kc
board_build.ldscript = ld/STM32L432KC.ld

[env:nucleo_l412kb]
board = nucleo_l412kb
board_build.ldscript = ld/STM32L412KB.ld

; Independent diagnostic builds (never selected by default).
[env:nucleo_l432kc_synthetic]
extends = env:nucleo_l432kc
build_flags = ${env.build_flags} -DSEM_SYNTH_SENSOR

[env:nucleo_l412kb_synthetic]
extends = env:nucleo_l412kb
build_flags = ${env.build_flags} -DSEM_SYNTH_SENSOR

[env:nucleo_l432kc_watchdog_test]
extends = env:nucleo_l432kc
build_flags = ${env.build_flags} -DSEM_WATCHDOG_TEST -DSEM_TRACE_LOOP

[env:nucleo_l412kb_watchdog_test]
extends = env:nucleo_l412kb
build_flags = ${env.build_flags} -DSEM_WATCHDOG_TEST -DSEM_TRACE_LOOP
